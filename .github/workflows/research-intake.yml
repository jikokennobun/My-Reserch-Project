name: Research literature intake

on:
  workflow_dispatch:
  schedule:
    # 07:15 JST on Monday, Wednesday, and Friday (UTC cron).
    - cron: "15 22 * * 0,2,4"

permissions:
  contents: write

concurrency:
  group: research-literature-intake
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      RESEARCH_CONTACT_EMAIL: ${{ secrets.RESEARCH_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research system
        run: python code/scripts/research_system.py validate
      - name: Collect candidate literature
        run: python code/scripts/research_system.py collect
      - name: Commit intake metadata only
        shell: bash
        run: |
          git config user.name "research-intake-bot"
          git config user.email "research-intake-bot@users.noreply.github.com"
          git add research/literature/inbox
          if test -f research/literature/catalog.jsonl; then
            git add research/literature/catalog.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No new candidates."
            exit 0
          fi
          git commit -m "chore(research): collect literature candidates"
          git push
